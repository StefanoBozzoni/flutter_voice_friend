pluginManagement {
    def flutterSdkPath = {
        // Parse local.properties without java.util.Properties to keep IDE lint happy.
        def props = [:]
        file("local.properties").readLines("UTF-8").each { line ->
            def trimmed = line.trim()
            if (!trimmed || trimmed.startsWith("#") || !trimmed.contains("=")) return
            def idx = trimmed.indexOf("=")
            def key = trimmed.substring(0, idx).trim()
            def value = trimmed.substring(idx + 1).trim()
            props[key] = value
        }
        def flutterSdkPath = props["flutter.sdk"]
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.5.2" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
